database:
  host: localhost
  port: 5432
  name: upwork
  user: upwork_app
  password: upwork12345app

experiment:
  name: job-normalization-benchmark
  sample_size: 100
  sampling_method: random
  random_seed: 42

models:
  extractor_a: gpt-5.6-luna
  extractor_b: gpt-6-luna
  evaluator: gpt-5.6-sol

variants:
  v1:
    model: gpt-5.6-luna
    jobs_per_request: 1
  v2:
    model: gpt-5.6-luna
    jobs_per_request: 100
  v3:
    model: gpt-6-luna
    jobs_per_request: 1
  v4:
    model: gpt-6-luna
    jobs_per_request: 100

processing:
  mode: batch_api
  requests_per_file: 100
  max_retries: 3
  completion_window: 24h
  reasoning_effort: low
  poll_interval_seconds: 30

evaluation:
  blind_comparison: true
  compare_all_variants: true
  rotate_candidates: true
  swap_positions: true
  requests_per_file: 25
  review_sample_size: 25

storage:
  base_dir: ./experiments
